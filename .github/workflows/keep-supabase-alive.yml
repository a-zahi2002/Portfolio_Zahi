name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Supabase API
    runs-on: ubuntu-latest
    steps:
      - name: Send API Keep-Alive Request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://mrscuirlixazmazwysud.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yc2N1aXJsaXhhem1hend5c3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDgxNjEsImV4cCI6MjA5NTM4NDE2MX0.t38jx74LsXlhjidmHaRm1K0ik1lJYwXXUnpMmlnpCu0}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$URL/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          echo "HTTP Response Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase project pinged successfully!"
          else
            echo "❌ Failed to ping Supabase project. Status code: $HTTP_STATUS"
            exit 1
          fi
